name: Build extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../flashfiller-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: flashfiller-extension
          path: |
            dist/
            flashfiller-extension.zip
