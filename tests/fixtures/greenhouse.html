<!-- Trimmed Greenhouse-style application form snapshot -->
<div id="application">
  <h2 class="section-header">Apply for this job</h2>
  <script type="application/ld+json">
    {
      "@type": "JobPosting",
      "title": "Senior Frontend Engineer",
      "hiringOrganization": { "@type": "Organization", "name": "Hooli" },
      "jobLocation": { "address": { "addressLocality": "San Francisco" } }
    }
  </script>
  <form id="application_form">
    <div class="field">
      <label for="first_name">First Name *</label>
      <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" required>
    </div>
    <div class="field">
      <label for="last_name">Last Name *</label>
      <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" required>
    </div>
    <div class="field">
      <label for="email">Email *</label>
      <input type="email" id="email" name="job_application[email]" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="job_application[phone]" autocomplete="tel">
    </div>
    <div class="field">
      <label for="resume">Resume/CV *</label>
      <input type="file" id="resume" name="job_application[resume]">
    </div>
    <div class="field">
      <label for="question_1">Why do you want to work at Hooli?</label>
      <textarea id="question_1" name="job_application[answers_attributes][0][text_value]"></textarea>
    </div>
    <div class="field">
      <label for="question_2">LinkedIn Profile</label>
      <input type="text" id="question_2" name="job_application[answers_attributes][1][text_value]">
    </div>
    <div class="field">
      <label for="question_3">Are you authorized to work in the United States?</label>
      <select id="question_3" name="job_application[answers_attributes][2][text_value]">
        <option value=""></option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <input type="text" name="honeypot_field" style="position:absolute;left:-9999px" tabindex="-1">
    <input type="submit" value="Submit Application">
  </form>
</div>
